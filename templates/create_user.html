{% extends 'base.html' %}
{% block title %}Create User – AMPATH Portal{% endblock %}
{% block content %}

<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card shadow-sm">
      <div class="card-header">
        <h5 class="mb-0 fw-bold">
          <i class="fas fa-user-plus me-2 text-primary"></i>Create New User
        </h5>
      </div>
      <div class="card-body">
        <form method="POST" action="{{ url_for('create_user') }}">
          <div class="mb-3">
            <label class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
            <input type="text" name="name" class="form-control" placeholder="Full name" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Email Address <span class="text-danger">*</span></label>
            <input type="email" name="email" class="form-control" placeholder="email@domain.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Department <span class="text-danger">*</span></label>
            <select name="department" class="form-select" required>
              <option value="">Select department</option>
              <option>ICT Department</option>
              <option>HIV/AIDS Programme</option>
              <option>Oncology</option>
              <option>Nutrition</option>
              <option>Mental Health</option>
              <option>Finance</option>
              <option>Administration</option>
              <option>Nursing</option>
              <option>Other</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Role <span class="text-danger">*</span></label>
            <select name="role" class="form-select" required>
              <option value="staff">Staff</option>
              <option value="technician">Technician</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div class="mb-4">
            <label class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
            <input type="password" name="password" class="form-control"
              placeholder="Minimum 8 characters" required minlength="8">
          </div>
          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary fw-semibold px-4">
              <i class="fas fa-user-plus me-2"></i>Create Account
            </button>
            <a href="{{ url_for('manage_users') }}" class="btn btn-outline-secondary">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
